[package]
name = "bn-headless-mcp"
version = "0.0.1"
# Edition 2021 because `binaryninja` is, and this engine is written against its
# API. Code here was written knowing let-chains are unavailable, so raising the
# edition is a real edit rather than a one-line bump.
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Binary Ninja as a complete MCP server, with a CLI derived from the same tool definitions"

[dependencies]
# Binary Ninja's Rust API is not on crates.io, has no `stable` branch, and has
# already broken us three times (README "Version pinning"). The revision below is
# the one `api_REVISION.txt` names inside the 5.3.9757 install — pinning that,
# rather than a tag or a branch, is the only way the API we compile against and
# the core we link against come from the same commit.
#
# `binaryninjacore-sys` has to be a *direct* dependency: its build script is what
# publishes `DEP_BINARYNINJACORE_PATH`, and cargo only forwards `links` metadata
# to direct dependents. Our `build.rs` consumes it.
binaryninja = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "aa25bfcfd36532ec3850558a58444df7727e297b" }
binaryninjacore-sys = { git = "https://github.com/Vector35/binaryninja-api.git", rev = "aa25bfcfd36532ec3850558a58444df7727e297b" }

# `http` for `serve --mode http`, which is what a bare invocation does: the
# listener — bind, token, Origin/Host, the banner, graceful shutdown — is the
# kit's, and is the same code `ida-headless-mcp` runs.
#
# Fetched rather than a path dependency, so that a clone of this repository
# builds on its own. Pinned to a revision rather than tracking a branch: the kit
# publishes the tool schemas and the CLI shape, so a change there moves this
# engine's wire surface, and that should happen when this file says so.
#
# To develop against a local checkout, point cargo at one without editing this
# file:
#
#     [patch."https://github.com/VibRev/vibrev.git"]
#     vibrev-kit = { path = "../vibrev/crates/vibrev-kit" }
#     vibrev-tool-macros = { path = "../vibrev/crates/vibrev-tool-macros" }
vibrev-kit = { git = "https://github.com/VibRev/vibrev.git", rev = "f008faa", features = [
    "http",
] }
vibrev-tool-macros = { git = "https://github.com/VibRev/vibrev.git", rev = "f008faa" }

rmcp = { version = "3.1.2", features = [
    "server",
    "client",
    "macros",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "schemars",
] }
# Only for the router the HTTP transport hands to
# `vibrev_kit::transport::Listener`. The listener itself, and the gate over
# every route on it, are the kit's.
axum = { version = "0.8", default-features = false, features = [
    "http1",
    "json",
    "tokio",
] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
# Deliberately *not* `preserve_order`: cargo unifies features across the whole
# graph, so turning it on here would reorder the keys of every JSON payload any
# crate in this build emits.
serde_json = "1"
clap = { version = "4.6", features = ["derive", "string"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "process", "signal", "sync", "time"] }
# `CancellationToken`, and only that. `vibrev_kit::tasks` registers one per
# background task and the registry deliberately keeps no `JoinHandle` — aborting
# a tokio task cannot interrupt a thread parked inside Binary Ninja's core, so
# cancellation is cooperative and the token is the whole mechanism.
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
debug = 1
